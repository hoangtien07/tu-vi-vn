# Render blueprint — tu-vi-vn production deploy.
# New → Blueprint Instance → point at this repo. Prompts for AI_API_KEY.
# Free tier notes: web services sleep after ~15min idle (cold start ~60s);
# free Postgres expires after 30 days — upgrade or export before then.
services:
  - type: web
    name: tuvi-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    # preDeployCommand is not supported on free tier — migrate at boot instead
    # (alembic upgrade head is idempotent).
    dockerCommand: sh -c "uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuvi-db
          property: connectionString
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "300"
      - key: KNOWLEDGE_PACK
        value: builtin

  - type: web
    name: tuvi-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /
    envVars:
      # fromService.hostAndPort only works for private services — web services
      # expose a public hostname. Predictable from the service name above; if
      # Render suffixes it (name taken), edit this env on tuvi-web.
      - key: API_INTERNAL_URL
        value: https://tuvi-api.onrender.com

databases:
  - name: tuvi-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
