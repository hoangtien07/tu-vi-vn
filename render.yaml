# Render blueprint — tu-vi-vn production deploy.
# New → Blueprint Instance → point at this repo. Prompts for AI_API_KEY.
# Free tier notes: web services sleep after ~15min idle (cold start ~60s);
# free Postgres expires after 30 days — upgrade or export before then.
services:
  - type: web
    name: tuvi-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /health
    # preDeployCommand is not supported on free tier — migrate at boot instead
    # (alembic upgrade head is idempotent). `sh start.sh` parses correctly
    # whether dockerCommand is shell-run or exec-split.
    dockerCommand: sh start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tuvi-db
          property: connectionString
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "300"
      - key: KNOWLEDGE_PACK
        value: builtin

  - type: web
    name: tuvi-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /
    envVars:
      # Public edge URL of the api service above (name was suffixed — the
      # unadorned tuvi-api.onrender.com belongs to someone else's service).
      - key: API_INTERNAL_URL
        value: https://tuvi-api-yflg.onrender.com

databases:
  - name: tuvi-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
