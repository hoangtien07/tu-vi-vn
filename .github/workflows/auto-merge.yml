name: auto-merge

# Squash-merges a PR labeled `automerge` once every check on its head SHA
# has completed successfully. Runs as github-actions[bot] — no PAT needed.
# Re-evaluates on: PR events AND each completed check_suite (CI finishing).

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge labeled PRs whose checks are green
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'automerge';
            const { owner, repo } = context.repo;

            let candidates = [];
            if (context.eventName === 'check_suite') {
              const headSha = context.payload.check_suite.head_sha;
              if (!headSha) return;
              const { data: open } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 50,
              });
              candidates = open.filter(p => p.head.sha === headSha);
            } else {
              candidates = [context.payload.pull_request];
            }

            for (const pr of candidates) {
              if (!pr || pr.draft) continue;
              if (!pr.labels.some(l => l.name === LABEL)) continue;

              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: pr.head.sha, per_page: 100,
              });
              const runs = data.check_runs;
              if (runs.length === 0) {
                console.log(`#${pr.number}: no checks yet, skip`);
                continue;
              }
              const pending = runs.filter(c => c.status !== 'completed');
              const failed = runs.filter(
                c => c.status === 'completed' && c.conclusion !== 'success'
              );
              if (pending.length || failed.length) {
                console.log(
                  `#${pr.number}: pending=${pending.length} failed=${failed.length}, skip`
                );
                continue;
              }

              console.log(`#${pr.number}: all ${runs.length} checks green — merging`);
              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number, merge_method: 'squash',
              });
            }
