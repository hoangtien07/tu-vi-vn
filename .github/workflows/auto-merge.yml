name: auto-merge

# Squash-merges a PR labeled `automerge` once `ci` is green on its head.
# Runs as github-actions[bot] — no PAT needed.
#
# Two triggers cover both orderings:
#   pull_request   — label applied after CI already passed → merge now.
#   workflow_run   — label applied while CI still running → the ci.yml
#                    completion re-evaluates and merges then.
# `check_suite` is intentionally NOT used: GitHub suppresses it for suites
# created by GitHub Actions (anti-recursion), and PR CI runs attach to the
# synthetic merge SHA, not pr.head.sha. Green is therefore evaluated on
# ci.yml workflow runs for the PR's head branch, not raw check runs.

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge labeled PRs whose ci.yml run is green
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'automerge';
            const CI_WORKFLOW = 'ci.yml';
            const { owner, repo } = context.repo;
            const mergeErrors = [];

            let numbers = [];
            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              numbers = (run.pull_requests || []).map(p => p.number);
              if (!numbers.length) {
                // Runs without PR association (e.g. push) — look up open PRs
                // whose head branch matches this run's head branch.
                const { data: open } = await github.rest.pulls.list({
                  owner, repo, state: 'open', per_page: 50,
                });
                numbers = open
                  .filter(p => p.head.ref === run.head_branch)
                  .map(p => p.number);
              }
            } else {
              numbers = [context.payload.pull_request.number];
            }

            for (const number of numbers) {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: number,
              });
              if (pr.state !== 'open' || pr.draft) continue;
              if (!pr.labels.some(l => l.name === LABEL)) continue;
              if (pr.head.repo.full_name !== `${owner}/${repo}`) {
                // Fork PR: its CI runs in a different check context —
                // never auto-merge code the base repo didn't test.
                console.log(`#${number}: fork head, skip`);
                continue;
              }

              const { data: wr } = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: CI_WORKFLOW,
                event: 'pull_request',
                branch: pr.head.ref,
                per_page: 20,
              });
              const runs = wr.workflow_runs;
              // A pending run associated with THIS PR means new code is being
              // tested — wait for it rather than trusting an older green run.
              const pending = runs.filter(
                r => r.status !== 'completed'
                  && (r.pull_requests || []).some(p => p.number === number)
              );
              // pull_request CI checks out the synthetic refs/pull/N/merge
              // commit, so run.head_sha != pr.head.sha. The merge commit's
              // second parent IS the PR head: require the newest completed
              // run to have been built from the PR's CURRENT head.
              let latest = null;
              for (const r of runs) {
                if (r.status !== 'completed') continue;
                const { data: c } = await github.rest.repos.getCommit({
                  owner, repo, ref: r.head_sha,
                });
                if ((c.parents || []).some(p => p.sha === pr.head.sha)) {
                  latest = r;
                  break;
                }
              }
              if (pending.length || !latest || latest.conclusion !== 'success') {
                console.log(
                  `#${number}: pending=${pending.length} ` +
                  `latest=${latest ? latest.conclusion : 'none'}, skip`
                );
                continue;
              }

              console.log(`#${number}: ci green (run ${latest.id}) — merging`);
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: number, merge_method: 'squash',
                  // Expected-head precondition: abort if anyone pushed after
                  // we read the PR — never merge an untested head.
                  sha: pr.head.sha,
                });
              } catch (e) {
                // Expected rejections: 405 already merged/not mergeable,
                // 409 head moved, 422 validation. Anything else (502/403/
                // throttle) is transient — record it and fail the job at
                // the end so the merge is retried, not silently dropped.
                if ([405, 409, 422].includes(e.status)) {
                  console.log(`#${number}: merge rejected (${e.status}), skip`);
                } else {
                  console.log(`#${number}: merge failed (${e.status || e.message})`);
                  mergeErrors.push(`#${number}: ${e.status || e.message}`);
                }
              }
            }
            if (mergeErrors.length) {
              throw new Error(`merge failures: ${mergeErrors.join('; ')}`);
            }
